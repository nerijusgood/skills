<!doctype html>
<html lang="{{LANG}}" data-palette="{{PALETTE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
/* Apply the saved theme before first paint. No saved choice: follow the system. */
(function(){var t=null;try{t=localStorage.getItem("infographic-theme")}catch(e){}
if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);
var p=null;try{p=localStorage.getItem("infographic-palette")}catch(e){}
if(p==="moss"||p==="earthy"||p==="berry")document.documentElement.setAttribute("data-palette",p);})();
</script>
<style>
/* Reading first: soft paper / soft night, never pure white or black.
   Contrast (WCAG): body text 16:1 light, 13:1 dark; muted text 8:1+; accent and tone text 7:1+.
   One palette, written with light-dark(light, dark). The theme switch only changes color-scheme. */
:root{
  color-scheme:light dark;
  --bg:light-dark(#f5f3ec,#15180f);--card:light-dark(#fffefb,#1e2317);
  --ink:light-dark(#1b2110,#ebe8de);--muted:light-dark(#454d3a,#b9bdad);
  --line:light-dark(#ddd8ca,#343c2a);
  --track:light-dark(#e7e4d8,#2a3122);
  --accent:{{ACCENT}};--accent-text:light-dark({{ACCENT}},{{ACCENT_DARK}});
  --sage:light-dark(#a9b8a1,#6f8068);--leaf:light-dark(#7e9650,#9ab36a);
  --terra:light-dark(#c8452a,#e0694c);--orange:light-dark(#e39a3b,#eeae55);
  --good:light-dark(#2d5a1b,#b3d589);--info:light-dark(#1c5560,#93d0c8);
  --warn:light-dark(#85470a,#f0c075);--bad:light-dark(#a22d16,#f5a08a);--neutral:var(--muted);--stat:var(--accent-text);
  --w:780px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

/* Palette presets. Pick with "palette" in the JSON or the palette button. Contrast on card: text 5.3:1+, body 12:1+. */
:root[data-palette="earthy"]{
  --bg:light-dark(#fef6d9,#181d27);--card:light-dark(#fffcf0,#212a38);
  --ink:light-dark(#1f2937,#f6ecd0);--muted:light-dark(#3f4756,#c9c4ae);
  --line:color-mix(in srgb,var(--ink) 14%,var(--bg));--track:color-mix(in srgb,var(--ink) 9%,var(--card));
  --accent:light-dark(#14532d,#8ccf9f);--accent-text:light-dark(#14532d,#8ccf9f);--stat:light-dark(#b8400a,#fb923c);
  --sage:light-dark(#9db89a,#5f7f66);--leaf:light-dark(#3f7d4e,#6fb584);
  --terra:light-dark(#7c2d12,#e0693c);--orange:light-dark(#ea580c,#fb923c);
  --good:light-dark(#14532d,#8ccf9f);--info:light-dark(#1e4e6e,#8fc1e3);
  --warn:light-dark(#8f4205,#f5b36b);--bad:light-dark(#a8281a,#f59a8a);
}
:root[data-palette="berry"]{
  --bg:light-dark(#f6f2fb,#0b1320);--card:light-dark(#ffffff,#131c2e);
  --ink:light-dark(#0b1320,#eef0f7);--muted:light-dark(#3b4254,#b4bbd0);
  --line:color-mix(in srgb,var(--ink) 14%,var(--bg));--track:color-mix(in srgb,var(--ink) 9%,var(--card));
  --accent:light-dark(#4c1d95,#a855f7);--accent-text:light-dark(#4c1d95,#c9a6fb);--stat:light-dark(#be123c,#fb7185);
  --sage:light-dark(#c9b6ee,#5b4a8a);--leaf:light-dark(#14b8a6,#2dd4bf);
  --terra:light-dark(#fb7185,#fb7185);--orange:light-dark(#a855f7,#c084fc);
  --good:light-dark(#0f6e63,#5eead4);--info:light-dark(#4c1d95,#9db8ff);
  --warn:light-dark(#8f4205,#fbbf77);--bad:light-dark(#be123c,#fb8fa0);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:1rem/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:var(--w);margin:0 auto;padding:56px 20px 96px}
h1,h2,.stat-v{font-family:var(--serif)}
h1{font-size:clamp(2rem,5.2vw,2.9rem);line-height:1.1;margin:0 0 10px;font-weight:600;letter-spacing:-.015em}
h2{font-size:1.45rem;font-weight:600;margin:0;line-height:1.2}
h3{font-size:1rem;margin:0 0 4px;font-weight:650}
p{margin:0}
.hero{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-bottom:36px}
.hero-text{min-width:0}
.sub{color:var(--muted);font-size:1.1rem}
.tldr{background:color-mix(in srgb,var(--accent) 8%,var(--card));
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
  border-radius:20px;padding:22px 26px;font-size:1.12rem;font-weight:500;margin-bottom:28px}
.tldr small{display:block;color:var(--accent-text);letter-spacing:.16em;text-transform:uppercase;
  font-size:.7rem;font-weight:700;margin-bottom:6px}
.block{margin:60px 0}
.h2row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.doodle{display:block;flex:none}
.doodle .l{stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.f-none{fill:none}.f-cream{fill:var(--card)}.f-sage{fill:var(--sage)}.f-leaf{fill:var(--leaf)}
.f-terra{fill:var(--terra)}.f-orange{fill:var(--orange)}
.doodle-hero{width:132px;height:132px}
.doodle-sm{width:64px;height:64px;margin:-18px 0 -6px}
.ico{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;margin-bottom:12px;
  background:color-mix(in srgb,var(--accent) 10%,var(--card));color:var(--accent-text)}
.ico svg{width:24px;height:24px}
.ico.sm{width:38px;height:38px;border-radius:12px;margin:0;flex:none}
.ico.sm svg{width:21px;height:21px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:28px 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.stat .ico{margin-bottom:10px}
.stat-v{font-size:2rem;font-weight:600;line-height:1.1;color:var(--stat)}
.stat-l{color:var(--muted);font-size:.92rem;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.card p{color:var(--muted);font-size:.96rem}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 10px;border-radius:999px;margin:4px 0 8px;color:var(--c);
  background:color-mix(in srgb,var(--c) 10%,transparent)}
.tone-good{--c:var(--good)}.tone-bad{--c:var(--bad)}.tone-warn{--c:var(--warn)}
.tone-info{--c:var(--info)}.tone-neutral{--c:var(--neutral)}
.points{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.pt{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--c,var(--accent-text));border-radius:18px;padding:16px 22px}
.pt>div{display:grid;gap:2px}
.pt b{font-size:1rem}
.pt span{color:var(--muted);font-size:.96rem}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.person{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:16px 20px}
.person>div{min-width:0}
.person b{display:block}
.person span{display:block;color:var(--muted);font-size:.9rem}
.person p{color:var(--muted);font-size:.9rem;margin-top:4px}
.av{width:56px;height:56px;border-radius:50%;flex:none;background:var(--line)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 26px 58px;counter-increment:s;min-height:38px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;
  border-radius:50%;border:1.5px solid var(--accent-text);color:var(--accent-text);
  display:grid;place-items:center;font-weight:700;font-family:var(--serif)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:18px;top:46px;bottom:6px;
  width:1px;background:var(--line)}
.steps p{color:var(--muted);font-size:.96rem}
.flow{display:flex;align-items:stretch;gap:0}
.node{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);
  border-top:3px solid color-mix(in srgb,var(--c) 60%,var(--card));border-radius:18px;padding:16px 16px 18px}
.node .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--c);color:var(--c);font-size:.8rem;font-weight:700;margin-bottom:8px}
.node p{color:var(--muted);font-size:.92rem}
.arr{flex:0 0 32px;display:grid;place-items:center;color:var(--muted)}
@media (max-width:640px){
  .flow{flex-direction:column}
  .arr{flex:0 0 32px;transform:rotate(90deg)}
}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.col{background:var(--card);border:1px solid var(--line);
  border-top:3px solid color-mix(in srgb,var(--c) 60%,var(--card));border-radius:20px;padding:20px 22px}
.col h3{color:var(--c)}
.col ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:.96rem}
.col li+li{margin-top:6px}
.bars{display:grid;gap:16px}
.bar-row{display:grid;grid-template-columns:minmax(80px,30%) 1fr 4.5rem;gap:14px;align-items:center;font-size:.96rem}
.bar-t{background:var(--track);border-radius:999px;height:10px;overflow:hidden}
.bar-f{height:100%;background:var(--accent-text);border-radius:999px}
.bar-v{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.chart{display:flex;gap:10px;align-items:stretch;height:var(--chart-h,250px);background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:20px 18px 14px}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.vplot{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.vv{font-size:.8rem;font-weight:650;height:1.5rem;font-variant-numeric:tabular-nums}
.vbar{width:100%;max-width:52px;background:var(--accent-text);border-radius:8px 8px 0 0;
  height:calc((100% - 1.5rem) * var(--r))}
.vl{color:var(--muted);font-size:.8rem;margin-top:8px}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:20px}
table{border-collapse:collapse;width:100%;font-size:.96rem}
th,td{padding:14px 18px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
  border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 18px 13px 48px;position:relative}
.checks li::before{content:"\2713";position:absolute;left:18px;top:13px;color:var(--good);font-weight:800}
.checks.todos li::before{content:"";left:17px;top:15px;width:18px;height:18px;
  border:1.5px solid var(--muted);border-radius:6px;color:var(--bg)}
.checks.todos li.done::before{content:"\2713";background:var(--accent-text);border-color:var(--accent-text);
  font-size:.74rem;line-height:15px;text-align:center;font-weight:800}
.checks.todos li.done{color:var(--muted);text-decoration:line-through;
  background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.callout{display:flex;gap:16px;align-items:flex-start;margin:48px 0;padding:20px 24px;border-radius:20px;
  border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
  background:color-mix(in srgb,var(--c) 7%,var(--card))}
.callout .ico{background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}
.callout strong{display:block;color:var(--c);margin-bottom:2px}
footer{color:var(--muted);font-size:.85rem;margin-top:56px;text-align:center}
.diagram{margin:0;position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:20px;overflow:hidden}
.diagram iframe{display:block;width:100%;height:var(--h,clamp(420px,68vh,880px));border:0}
.diagram-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;
  color:var(--muted);font-size:.9rem;padding:10px 20px;border-top:1px solid var(--line)}
.diagram-open{flex:none;margin-left:auto;font:inherit;font-size:.8rem;font-weight:600;color:var(--accent-text);
  background:none;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.diagram-open:hover,.diagram-open:focus-visible{border-color:var(--accent-text)}
.theme-toggle,.palette-toggle{position:fixed;top:14px;right:14px;z-index:5;width:42px;height:42px;display:grid;place-items:center;
  border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  box-shadow:0 1px 3px rgb(0 0 0/.12)}
.palette-toggle{right:64px}
.theme-toggle:hover,.theme-toggle:focus-visible,.palette-toggle:hover,.palette-toggle:focus-visible{border-color:var(--accent-text);color:var(--accent-text)}
.theme-toggle svg,.palette-toggle svg{width:21px;height:21px}
.theme-toggle .sun{display:none}
:root[data-resolved="dark"] .theme-toggle .sun{display:block}
:root[data-resolved="dark"] .theme-toggle .moon{display:none}
/* Content width grows with the screen. Edit --w and the rem base here. */
@media (min-width:900px){:root{--w:880px}}
@media (min-width:1200px){:root{--w:1080px}.wrap{padding-top:64px}.doodle-hero{width:156px;height:156px}}
@media (min-width:1600px){:root{--w:1320px;--chart-h:300px}html{font-size:17px}}
@media (min-width:2000px){:root{--w:1600px;--chart-h:340px}html{font-size:18px}}
@media (min-width:2600px){:root{--w:1920px}html{font-size:20px}}
@media (max-width:560px){
  .wrap{padding:36px 16px 72px}
  .hero{flex-direction:column-reverse;align-items:flex-start;gap:12px}
  .doodle-hero{width:96px;height:96px}
}
@media print{:root,:root[data-theme]{color-scheme:light}body{background:#fff}.wrap{padding:0;max-width:none}.diagram-open,.theme-toggle,.palette-toggle{display:none}}
</style>
</head>
<body>
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch theme" hidden>
<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<button type="button" class="palette-toggle" id="palette-toggle" aria-label="Switch colour palette" title="Colour palette" hidden>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-3.9-4-7.2-9-7.2z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>
</button>
<main class="wrap">
{{BODY}}
</main>
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById("theme-toggle");
  var mq=window.matchMedia("(prefers-color-scheme: dark)");
  function resolved(){var t=root.getAttribute("data-theme");return t||(mq.matches?"dark":"light");}
  function frames(){return document.querySelectorAll(".diagram iframe");}
  function push(win){var m={igTheme:resolved()};if(win){win.postMessage(m,"*");}
    else frames().forEach(function(f){try{f.contentWindow.postMessage(m,"*")}catch(e){}});}
  function apply(){root.setAttribute("data-resolved",resolved());
    btn.setAttribute("aria-label","Switch to "+(resolved()==="dark"?"light":"dark")+" theme");push();}
  var pbtn=document.getElementById("palette-toggle"),names=["moss","earthy","berry"];
  var pretty={moss:"Moss",earthy:"Warm earthy",berry:"Berry neon"};
  function palette(){var p=root.getAttribute("data-palette");return names.indexOf(p)<0?"moss":p;}
  function plabel(){var n=names[(names.indexOf(palette())+1)%names.length];
    pbtn.setAttribute("aria-label","Palette: "+pretty[palette()]+". Switch to "+pretty[n]);pbtn.title=pretty[palette()]+" (click for "+pretty[n]+")";}
  pbtn.hidden=false;plabel();
  pbtn.addEventListener("click",function(){var n=names[(names.indexOf(palette())+1)%names.length];
    root.setAttribute("data-palette",n);try{localStorage.setItem("infographic-palette",n)}catch(e){}plabel();});
  btn.hidden=false;
  btn.addEventListener("click",function(){var next=resolved()==="dark"?"light":"dark";
    root.setAttribute("data-theme",next);try{localStorage.setItem("infographic-theme",next)}catch(e){}apply();});
  (mq.addEventListener?mq.addEventListener("change",apply):mq.addListener(apply));
  window.addEventListener("message",function(ev){
    if(ev.data&&ev.data.igReady){frames().forEach(function(f){if(f.contentWindow===ev.source)push(ev.source);});}});
  apply();
  document.querySelectorAll("[data-open]").forEach(function(b){
    b.hidden=false;
    b.addEventListener("click",function(){
      var f=b.closest(".diagram").querySelector("iframe");
      window.open(URL.createObjectURL(new Blob([f.srcdoc],{type:"text/html"})),"_blank");
    });
  });
})();
</script>
</body>
</html>
