<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1b1b1f;--muted:#62626b;--line:#e4e2dc;
  --accent:{{ACCENT}};--accent-text:{{ACCENT}};
  --good:#1f8a4c;--bad:#c2410c;--warn:#a16207;--info:#2563eb;--neutral:#62626b;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121214;--card:#1c1c20;--ink:#f1f1f3;--muted:#a3a3ad;--line:#2d2d34;
    --accent-text:color-mix(in srgb,{{ACCENT}} 55%,#fff);
    --good:#4ade80;--bad:#fb923c;--warn:#facc15;--info:#60a5fa;--neutral:#a3a3ad;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:1.1em;border-radius:3px;background:var(--accent)}
h3{font-size:1rem;margin:0 0 4px}
p{margin:0}
.sub{color:var(--muted);font-size:1.05rem;margin-bottom:20px}
.tldr{background:var(--accent);color:#fff;border-radius:16px;padding:16px 20px;
  font-size:1.1rem;font-weight:600;margin-bottom:20px}
.tldr small{display:block;opacity:.85;letter-spacing:.08em;text-transform:uppercase;
  font-size:.72rem;margin-bottom:4px}
.block{margin:30px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat-v{font-size:1.8rem;font-weight:750;letter-spacing:-.02em;line-height:1.1;color:var(--accent-text)}
.stat-l{color:var(--muted);font-size:.9rem;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card p{color:var(--muted);font-size:.95rem}
.icon{font-size:1.5rem;display:block;margin-bottom:6px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;margin:2px 0 6px;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent)}
.tone-good{--c:var(--good)}.tone-bad{--c:var(--bad)}.tone-warn{--c:var(--warn)}
.tone-info{--c:var(--info)}.tone-neutral{--c:var(--neutral)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 18px 52px;counter-increment:s;min-height:36px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;
  border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.steps li:not(:last-child)::after{content:"";position:absolute;left:17px;top:40px;bottom:4px;
  width:2px;background:var(--line)}
.steps p{color:var(--muted);font-size:.95rem}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);
  border-radius:14px;padding:14px 16px}
.col h3{color:var(--c)}
.col ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.95rem}
.col li+li{margin-top:4px}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(80px,30%) 1fr 4.5rem;gap:10px;align-items:center;font-size:.95rem}
.bar-t{background:var(--line);border-radius:999px;height:12px;overflow:hidden}
.bar-f{height:100%;background:var(--accent);border-radius:999px}
.bar-v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px 10px 40px;position:relative}
.checks li::before{content:"\2713";position:absolute;left:14px;top:10px;color:var(--good);font-weight:800}
.callout{display:block;margin:28px 0;padding:14px 18px;border-radius:14px;
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  background:color-mix(in srgb,var(--c) 10%,var(--card))}
.callout strong{display:block;color:var(--c);margin-bottom:2px}
footer{color:var(--muted);font-size:.85rem;margin-top:32px;text-align:center}
@media print{body{background:#fff}.wrap{padding:0}}
</style>
</head>
<body>
<main class="wrap">
{{BODY}}
</main>
</body>
</html>
