<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Calm moss theme. Palette: snow, linen, sage mist, warm stone, forest moss, deep pine. */
:root{
  --bg:#f6f5ee;--card:#fdfcf8;--ink:#16302a;
  --muted:color-mix(in srgb,var(--ink) 68%,var(--bg));
  --line:color-mix(in srgb,var(--ink) 12%,var(--bg));
  --track:color-mix(in srgb,var(--ink) 8%,var(--card));
  --accent:{{ACCENT}};--accent-text:{{ACCENT}};
  --sage:#a9b8a1;--stone:#b8a58d;--linen:#e8e1d6;
  --good:#3e6b45;--info:#33564d;--warn:#7d5d22;--bad:#a5472f;--neutral:var(--muted);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1c1a;--card:#132825;--ink:#ece8dc;
    --accent-text:{{ACCENT_DARK}};
    --good:#a6c79b;--info:#8fc3b8;--warn:#d9bb78;--bad:#e3957e;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:40px 16px 64px}
h1,h2,.stat-v{font-family:var(--serif)}
h1{font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.12;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:600;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
h3{font-size:1rem;margin:0 0 4px;font-weight:650}
p{margin:0}
.sub{color:var(--muted);font-size:1.05rem;margin-bottom:24px}
.tldr{background:color-mix(in srgb,var(--accent) 9%,var(--card));
  border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);
  border-radius:14px;padding:16px 20px;font-size:1.1rem;font-weight:500;margin-bottom:22px}
.tldr small{display:block;color:var(--accent-text);letter-spacing:.16em;text-transform:uppercase;
  font-size:.7rem;font-weight:700;margin-bottom:4px}
.block{margin:34px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat-v{font-size:1.9rem;font-weight:600;line-height:1.1;color:var(--accent-text)}
.stat-l{color:var(--muted);font-size:.9rem;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card p{color:var(--muted);font-size:.95rem}
.icon{font-size:1.4rem;display:block;margin-bottom:6px}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 9px;border-radius:999px;margin:2px 0 6px;color:var(--c);
  background:color-mix(in srgb,var(--c) 12%,transparent)}
.tone-good{--c:var(--good)}.tone-bad{--c:var(--bad)}.tone-warn{--c:var(--warn)}
.tone-info{--c:var(--info)}.tone-neutral{--c:var(--neutral)}
.points{display:grid;gap:10px}
.pt{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent-text));
  border-radius:12px;padding:12px 16px;display:grid;gap:2px}
.pt b{font-size:1rem}
.pt span{color:var(--muted);font-size:.95rem}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 18px 52px;counter-increment:s;min-height:36px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;
  border-radius:50%;border:1.5px solid var(--accent-text);color:var(--accent-text);
  display:grid;place-items:center;font-weight:700;font-family:var(--serif)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:16px;top:40px;bottom:4px;
  width:1px;background:var(--line)}
.steps p{color:var(--muted);font-size:.95rem}
.flow{display:flex;align-items:stretch;gap:0}
.node{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);
  border-top:3px solid color-mix(in srgb,var(--c) 60%,var(--card));border-radius:12px;padding:12px 14px}
.node .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--c);color:var(--c);font-size:.78rem;font-weight:700;margin-bottom:6px}
.node p{color:var(--muted);font-size:.9rem}
.arr{flex:0 0 30px;display:grid;place-items:center;color:var(--muted)}
@media (max-width:640px){
  .flow{flex-direction:column}
  .arr{flex:0 0 30px;transform:rotate(90deg)}
}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{background:var(--card);border:1px solid var(--line);
  border-top:3px solid color-mix(in srgb,var(--c) 60%,var(--card));border-radius:12px;padding:14px 16px}
.col h3{color:var(--c)}
.col ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.95rem}
.col li+li{margin-top:4px}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(80px,30%) 1fr 4.5rem;gap:10px;align-items:center;font-size:.95rem}
.bar-t{background:var(--track);border-radius:999px;height:10px;overflow:hidden}
.bar-f{height:100%;background:var(--accent-text);border-radius:999px}
.bar-v{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.chart{display:flex;gap:8px;align-items:stretch;height:220px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:14px 12px 10px}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.vplot{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.vv{font-size:.8rem;font-weight:650;height:1.4rem;font-variant-numeric:tabular-nums}
.vbar{width:100%;max-width:52px;background:var(--accent-text);border-radius:6px 6px 0 0;
  height:calc((100% - 1.4rem) * var(--r))}
.vl{color:var(--muted);font-size:.8rem;margin-top:6px}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:10px 14px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
  border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px 10px 42px;position:relative}
.checks li::before{content:"\2713";position:absolute;left:15px;top:10px;color:var(--good);font-weight:800}
.checks.todos li::before{content:"";left:14px;top:12px;width:17px;height:17px;
  border:1.5px solid var(--muted);border-radius:5px;color:var(--bg)}
.checks.todos li.done::before{content:"\2713";background:var(--accent-text);border-color:var(--accent-text);
  font-size:.72rem;line-height:14px;text-align:center;font-weight:800}
.checks.todos li.done{color:var(--muted);text-decoration:line-through;
  background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.callout{display:block;margin:30px 0;padding:14px 18px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--c) 28%,transparent);
  background:color-mix(in srgb,var(--c) 7%,var(--card))}
.callout strong{display:block;color:var(--c);margin-bottom:2px}
footer{color:var(--muted);font-size:.85rem;margin-top:36px;text-align:center}
@media print{body{background:#fff}.wrap{padding:0}}
</style>
</head>
<body>
<main class="wrap">
{{BODY}}
</main>
</body>
</html>
